<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Journal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; padding: 2rem 1rem; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; }
    header { border-bottom: 1px solid #1e293b; padding-bottom: 1.5rem; margin-bottom: 2rem; }
    h1 { color: #34d399; font-size: 2rem; font-weight: 700; margin-bottom: 0.25rem; }
    p.subtitle { color: #94a3b8; font-size: 0.95rem; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2.5rem; }
    .stat-card { background: #1e293b; border: 1px solid #334155; padding: 1.25rem; rounded: 0.75rem; border-radius: 12px; }
    .stat-title { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; font-weight: 600; letter-spacing: 0.05em; }
    .stat-value { font-size: 2rem; font-weight: 800; margin-top: 0.25rem; }
    .val-python { color: #60a5fa; }
    .val-sql { color: #fbbf24; }
    .val-project { color: #c084fc; }

    .section-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; color: #e2e8f0; }
    .entries-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .entry-card { background: rgba(30, 41, 59, 0.5); border: 1px solid #334155; padding: 1rem; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .entry-left { display: flex; align-items: center; gap: 0.75rem; }
    .badge { font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 4px; font-weight: 600; background: #334155; color: #e2e8f0; }
    .badge.Python { background: #1e3a8a; color: #93c5fd; }
    .badge.SQL { background: #78350f; color: #fde68a; }
    .badge.Project { background: #581c87; color: #e9d5ff; }
    .entry-link { color: #f8fafc; text-decoration: none; font-weight: 500; }
    .entry-link:hover { color: #34d399; text-decoration: underline; }
    .entry-date { font-size: 0.85rem; color: #64748b; }
    .empty-msg { color: #64748b; font-style: italic; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>My Journal</h1>
      <p class="subtitle">Daily coding, problem-solving, and project log.</p>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-title">Python Solved</div>
        <div class="stat-value val-python" id="python-count">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">SQL Solved</div>
        <div class="stat-value val-sql" id="sql-count">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Projects Built</div>
        <div class="stat-value val-project" id="project-count">0</div>
      </div>
    </div>

    <section>
      <div class="section-title">Activity Log</div>
      <div id="journal-entries" class="entries-list">Loading entries...</div>
    </section>
  </div>

  <script>
    fetch('data.json?v=' + new Date().getTime())
      .then(res => res.json())
      .then(data => {
        let py = 0, sql = 0, prj = 0;
        const container = document.getElementById('journal-entries');
        container.innerHTML = '';

        if (!Array.isArray(data) || data.length === 0) {
          container.innerHTML = '<div class="empty-msg">No entries logged yet.</div>';
          return;
        }

        data.forEach(item => {
          if (item.category === 'Python') py++;
          if (item.category === 'SQL') sql++;
          if (item.category === 'Project') prj++;

          const el = document.createElement('div');
          el.className = 'entry-card';
          el.innerHTML = `
            <div class="entry-left">
              <span class="badge ${item.category}">${item.category}</span>
              <a href="${item.link}" target="_blank" class="entry-link">${item.name}</a>
            </div>
            <span class="entry-date">${item.date}</span>
          `;
          container.appendChild(el);
        });

        document.getElementById('python-count').innerText = py;
        document.getElementById('sql-count').innerText = sql;
        document.getElementById('project-count').innerText = prj;
      })
      .catch(err => {
        document.getElementById('journal-entries').innerHTML = '<div class="empty-msg">Error loading entries. Please check workflow.</div>';
      });
  </script>
</body>
</html>
