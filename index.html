<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Journal | Daily Learning Log</title>
  
  <!-- Social Media Preview Card Tags -->
  <meta property="og:title" content="My Journal - Daily Coding & Learning Log">
  <meta property="og:description" content="Tracking Python problems, SQL challenges, and full-stack projects daily.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://altamashsameer.github.io/My-Journal/">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      background-color: #0a0915; 
      color: #f1f5f9; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 2.5rem 1rem; 
      min-height: 100vh;
      background-image: radial-gradient(circle at 50% 0%, rgba(124, 58, 237, 0.12) 0%, transparent 50%);
    }

    .container { max-width: 860px; margin: 0 auto; }
    
    header { 
      border-bottom: 1px solid rgba(139, 92, 246, 0.15); 
      padding-bottom: 1.75rem; 
      margin-bottom: 2rem; 
    }

    h1 { 
      background: linear-gradient(135deg, #a855f7 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2.25rem; 
      font-weight: 800; 
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem; 
    }

    p.subtitle { color: #94a3b8; font-size: 0.95rem; font-weight: 400; }

    /* Stats Section */
    .stats-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); 
      gap: 1rem; 
      margin-bottom: 2rem; 
    }

    .stat-card { 
      background: #121024; 
      border: 1px solid #231f42; 
      padding: 1.25rem; 
      border-radius: 16px; 
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .stat-card:hover {
      border-color: #4c1d95;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(124, 58, 237, 0.12);
    }

    .stat-title { 
      font-size: 0.72rem; 
      text-transform: uppercase; 
      color: #818cf8; 
      font-weight: 700; 
      letter-spacing: 0.08em; 
    }

    .stat-value { font-size: 2.1rem; font-weight: 800; margin-top: 0.35rem; }
    .val-streak { color: #fb923c; }
    .val-python { color: #38bdf8; }
    .val-sql { color: #facc15; }
    .val-project { color: #c084fc; }

    /* Heatmap Section */
    .heatmap-card { 
      background: #121024; 
      border: 1px solid #231f42; 
      border-radius: 16px; 
      padding: 1.5rem; 
      margin-bottom: 2rem; 
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .heatmap-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
    .heatmap-title { font-size: 1.05rem; font-weight: 700; color: #e2e8f0; }

    .nav-btn { 
      background: #1e1b3a; 
      border: 1px solid #322d5d; 
      color: #cbd5e1; 
      padding: 0.4rem 0.85rem; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 0.8rem; 
      font-weight: 600; 
      transition: all 0.2s;
    }

    .nav-btn:hover { background: #7c3aed; color: #fff; border-color: #8b5cf6; }

    .heatmap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(20px, 1fr)); gap: 6px; margin-bottom: 1.25rem; }
    
    .day-square { 
      width: 100%; 
      aspect-ratio: 1; 
      border-radius: 5px; 
      transition: transform 0.15s ease, box-shadow 0.15s ease; 
      cursor: pointer;
    }

    .day-square:hover { transform: scale(1.25); z-index: 10; }

    /* Purple Heatmap Palette */
    .lvl-0 { background-color: #1a1733; border: 1px solid rgba(255, 255, 255, 0.02); }
    .lvl-1 { background-color: #5b21b6; }
    .lvl-2 { background-color: #7c3aed; box-shadow: 0 0 8px rgba(124, 58, 237, 0.3); }
    .lvl-3 { background-color: #a855f7; box-shadow: 0 0 12px rgba(168, 85, 247, 0.6); }

    .legend { display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 0.75rem; color: #64748b; font-weight: 500; }
    .legend-box { width: 12px; height: 12px; border-radius: 3px; }

    /* Activity Log Section */
    .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.75rem; }
    .filter-group { display: flex; gap: 0.4rem; background: #121024; padding: 4px; border-radius: 10px; border: 1px solid #231f42; }

    .filter-btn { 
      background: transparent; 
      border: none; 
      color: #94a3b8; 
      padding: 0.35rem 0.85rem; 
      border-radius: 7px; 
      font-size: 0.8rem; 
      cursor: pointer; 
      font-weight: 600; 
      transition: all 0.2s;
    }

    .filter-btn.active { background: #7c3aed; color: #ffffff; }

    .entries-container { 
      max-height: 320px; 
      overflow-y: auto; 
      padding-right: 6px; 
      display: flex; 
      flex-direction: column; 
      gap: 0.75rem; 
    }

    .entries-container::-webkit-scrollbar { width: 6px; }
    .entries-container::-webkit-scrollbar-track { background: #0a0915; }
    .entries-container::-webkit-scrollbar-thumb { background: #231f42; border-radius: 4px; }

    .entry-card { 
      background: #121024; 
      border: 1px solid #231f42; 
      padding: 0.9rem 1.1rem; 
      border-radius: 12px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      transition: border-color 0.2s;
    }

    .entry-card:hover { border-color: #4c1d95; }

    .entry-left { display: flex; align-items: center; gap: 0.85rem; }
    
    .badge { 
      font-size: 0.72rem; 
      padding: 0.25rem 0.65rem; 
      border-radius: 6px; 
      font-weight: 700; 
      letter-spacing: 0.02em;
    }

    .badge.Python { background: rgba(56, 189, 248, 0.12); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge.SQL { background: rgba(250, 204, 21, 0.12); color: #facc15; border: 1px solid rgba(250, 204, 21, 0.3); }
    .badge.Project { background: rgba(192, 132, 252, 0.12); color: #c084fc; border: 1px solid rgba(192, 132, 252, 0.3); }

    .entry-link { color: #f1f5f9; text-decoration: none; font-weight: 500; font-size: 0.95rem; }
    .entry-link:hover { color: #a855f7; text-decoration: underline; }
    .entry-date { font-size: 0.82rem; color: #64748b; font-weight: 500; }
    .empty-msg { color: #64748b; font-style: italic; padding: 1rem 0; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>My Journal</h1>
      <p class="subtitle">Daily learning progress, coding challenges, and project milestones.</p>
    </header>

    <!-- Top Stats Bar -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-title">Active Streak</div>
        <div class="stat-value val-streak" id="streak-count">0 Days 🔥</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Python Solved</div>
        <div class="stat-value val-python" id="python-count">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">SQL Solved</div>
        <div class="stat-value val-sql" id="sql-count">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Projects Built</div>
        <div class="stat-value val-project" id="project-count">0</div>
      </div>
    </div>

    <!-- 2-Month Purple Heatmap -->
    <div class="heatmap-card">
      <div class="heatmap-header">
        <div class="heatmap-title" id="heatmap-range-title">Activity Grid</div>
        <div>
          <button class="nav-btn" onclick="navigateHeatmap(-1)">← Prev</button>
          <button class="nav-btn" onclick="navigateHeatmap(1)">Next →</button>
        </div>
      </div>

      <div class="heatmap-grid" id="heatmap-grid"></div>

      <div class="legend">
        <span>Less</span>
        <div class="legend-box lvl-0"></div>
        <div class="legend-box lvl-1"></div>
        <div class="legend-box lvl-2"></div>
        <div class="legend-box lvl-3"></div>
        <span>More</span>
      </div>
    </div>

    <!-- Scrollable Activity Log with Filters -->
    <section>
      <div class="log-header">
        <h2 style="font-size: 1.15rem; font-weight: 700; color: #e2e8f0;">Activity Log</h2>
        <div class="filter-group">
          <button class="filter-btn active" onclick="filterLogs('All', this)">All</button>
          <button class="filter-btn" onclick="filterLogs('Python', this)">Python</button>
          <button class="filter-btn" onclick="filterLogs('SQL', this)">SQL</button>
          <button class="filter-btn" onclick="filterLogs('Project', this)">Projects</button>
        </div>
      </div>

      <div id="journal-entries" class="entries-container">Loading entries...</div>
    </section>
  </div>

  <script>
    let globalData = [];
    let pageOffset = 0;

    fetch('data.json?v=' + new Date().getTime())
      .then(res => res.json())
      .then(data => {
        globalData = Array.isArray(data) ? data : [];
        updateDashboard();
      })
      .catch(() => {
        document.getElementById('journal-entries').innerHTML = '<div class="empty-msg">No entries found yet.</div>';
      });

    function updateDashboard() {
      renderStats();
      renderHeatmap();
      renderLog('All');
    }

    function renderStats() {
      let py = 0, sql = 0, prj = 0;
      const dates = new Set();

      globalData.forEach(item => {
        if (item.category === 'Python') py++;
        if (item.category === 'SQL') sql++;
        if (item.category === 'Project') prj++;
        if (item.date && item.date !== 'N/A') dates.add(item.date);
      });

      document.getElementById('python-count').innerText = py;
      document.getElementById('sql-count').innerText = sql;
      document.getElementById('project-count').innerText = prj;
      document.getElementById('streak-count').innerText = calculateStreak(dates) + ' Days 🔥';
    }

    function calculateStreak(datesSet) {
      if (datesSet.size === 0) return 0;
      let streak = 0;
      let checkDate = new Date();

      while (true) {
        const dateStr = checkDate.toISOString().split('T')[0];
        if (datesSet.has(dateStr)) {
          streak++;
          checkDate.setDate(checkDate.getDate() - 1);
        } else {
          if (streak === 0) {
            checkDate.setDate(checkDate.getDate() - 1);
            const yesterdayStr = checkDate.toISOString().split('T')[0];
            if (datesSet.has(yesterdayStr)) {
              streak++;
              checkDate.setDate(checkDate.getDate() - 1);
              continue;
            }
          }
          break;
        }
      }
      return streak;
    }

    function renderHeatmap() {
      const grid = document.getElementById('heatmap-grid');
      grid.innerHTML = '';

      const counts = {};
      globalData.forEach(item => {
        if (item.date && item.date !== 'N/A') {
          counts[item.date] = (counts[item.date] || 0) + 1;
        }
      });

      const startDate = new Date(2026, 7, 20); 
      startDate.setDate(startDate.getDate() + (pageOffset * 60));

      const endDate = new Date(startDate);
      endDate.setDate(endDate.getDate() + 59);

      const opts = { month: 'short', day: 'numeric', year: 'numeric' };
      document.getElementById('heatmap-range-title').innerText = 
        `${startDate.toLocaleDateString('en-US', opts)} – ${endDate.toLocaleDateString('en-US', opts)}`;

      for (let i = 0; i < 60; i++) {
        const d = new Date(startDate);
        d.setDate(d.getDate() + i);
        const dateStr = d.toISOString().split('T')[0];
        const activityCount = counts[dateStr] || 0;

        let lvl = 'lvl-0';
        if (activityCount === 1) lvl = 'lvl-1';
        else if (activityCount === 2) lvl = 'lvl-2';
        else if (activityCount >= 3) lvl = 'lvl-3';

        const sq = document.createElement('div');
        sq.className = `day-square ${lvl}`;
        sq.title = `${dateStr}: ${activityCount} item(s) completed`;
        grid.appendChild(sq);
      }
    }

    function navigateHeatmap(dir) {
      pageOffset += dir;
      renderHeatmap();
    }

    function filterLogs(category, btnElement) {
      if (btnElement) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
      }
      renderLog(category);
    }

    function renderLog(category) {
      const container = document.getElementById('journal-entries');
      container.innerHTML = '';

      const filtered = category === 'All' 
        ? globalData 
        : globalData.filter(i => i.category === category);

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-msg">No logs found for this category.</div>';
        return;
      }

      filtered.forEach(item => {
        const el = document.createElement('div');
        el.className = 'entry-card';
        el.innerHTML = `
          <div class="entry-left">
            <span class="badge ${item.category}">${item.category}</span>
            <a href="${item.link}" target="_blank" class="entry-link">${item.name}</a>
          </div>
          <span class="entry-date">${item.date}</span>
        `;
        container.appendChild(el);
      });
    }
  </script>
</body>
</html>
